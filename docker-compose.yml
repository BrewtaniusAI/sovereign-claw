services:
  sovereign-claw:
    build: .
    container_name: sovereign-claw
    ports:
      - "8765:8765"   # Gateway WebSocket
      - "8766:8766"   # MCP server
      - "9090:9090"   # Webhook receiver
    volumes:
      - ./data:/app/data
      - sovereign-skills:/root/.sovereign_claw/skills
    environment:
      - SOVEREIGN_LOG_LEVEL=INFO
      - SOVEREIGN_PROOF_VAULT_PATH=/app/data/proof_vault.db
      - SOVEREIGN_EVENT_STREAM_PATH=/app/data/events.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sovereign_claw; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sovereign-skills:
