services:
  sovereign-claw:
    build: .
    container_name: sovereign-claw
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - sovereign-skills:/home/sovereign/.sovereign_claw/skills
    environment:
      SOVEREIGN_BRIDGE_HOST: 0.0.0.0
      SOVEREIGN_BRIDGE_PORT: 8787
      SOVEREIGN_BRIDGE_TOKEN: ${SOVEREIGN_BRIDGE_TOKEN:?set SOVEREIGN_BRIDGE_TOKEN}
      SOVEREIGN_LOG_LEVEL: INFO
      SOVEREIGN_PROOF_VAULT_PATH: /app/data/proof_vault.db
      SOVEREIGN_EVENT_STREAM_PATH: /app/data/events.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  sovereign-skills:
