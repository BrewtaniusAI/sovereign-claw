name: Community License Hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  community-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install build verifier tools
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools>=77.0.3" wheel "build>=1.2.1,<2" "pytest>=8,<9"
      - name: Verify repository license contract
        run: |
          python -m pytest -q tests/test_license_hygiene.py
          python scripts/verify_community_distribution.py
      - name: Build Community distributions without isolated resolver
        run: python -m build --no-isolation
      - name: Verify shipped wheel and sdist
        run: >-
          python scripts/verify_community_distribution.py
          --artifact dist/*.whl
          --artifact dist/*.tar.gz
