name: One-shot remove dead T_MAX flag

on:
  push:
    branches:
      - feat/measured-drift-closure

permissions:
  contents: write

jobs:
  bounded-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/measured-drift-closure
          fetch-depth: 0

      - name: Apply exact asserted cleanup
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path

          path = Path("src/sovereign_claw/orchestrator.py")
          data = path.read_bytes()
          git_blob_sha = sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          expected = "741cfc21c652e16b82e4a969b012acf4a928dfcc"
          if git_blob_sha != expected:
              raise SystemExit(f"unexpected orchestrator blob: {git_blob_sha} != {expected}")

          substitutions = (
              (b"        _t_max_fired = False\n", b"", 1),
              (b"                _t_max_fired = True\n", b"", 1),
              (
                  b"                        t_max_violated=_t_max_fired or step_idx >= manifold.t_max_steps,\n",
                  b"                        t_max_violated=step_idx >= manifold.t_max_steps,\n",
                  1,
              ),
              (b"                    _t_max_fired = True\n", b"", 1),
          )
          for old, new, expected_count in substitutions:
              count = data.count(old)
              if count != expected_count:
                  raise SystemExit(f"unexpected replacement count {count} for {old!r}")
              data = data.replace(old, new)

          if b"_t_max_fired" in data:
              raise SystemExit("dead T_MAX flag remains after bounded cleanup")
          path.write_bytes(data)
          PY

          python -m compileall -q src/sovereign_claw/orchestrator.py
          git diff --check
          test "$(git diff --name-only -- src/sovereign_claw/orchestrator.py | tr -d '\r')" = "src/sovereign_claw/orchestrator.py"

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-remove-dead-tmax.yml
          git config user.name "BrewtaniusAI bounded maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sovereign_claw/orchestrator.py .github/workflows/one-shot-remove-dead-tmax.yml
          git diff --cached --check
          git commit -m "fix: remove dead T_MAX bookkeeping flag"
          git push origin HEAD:feat/measured-drift-closure
