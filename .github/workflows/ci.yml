name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install "ruff==0.15.6" "mypy" "pytest" "pytest-cov"

      - name: Lint
        run: ruff check src tests examples

      - name: Format check
        run: ruff format --check src tests examples

      - name: Type check
        run: mypy src

      - name: Test with coverage
        run: pytest --cov=sovereign_claw --cov-report=term-missing --cov-report=xml

      - name: Upload coverage xml
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate SBOM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install "ruff==0.15.6"
          python scripts/generate_sbom.py
      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom/sovereign-claw.cdx.json