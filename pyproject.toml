[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-claw"
version = "3.3.0"
description = "Governed sovereign agent runtime with deterministic execution, proof-vaulted audit trails, and constraint-first governance."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "agents", "llm", "thermodynamics", "governance", "deterministic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0",
    "sqlite-utils>=3.36.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "build>=1.2.1",
    "cyclonedx-bom>=4.1",
]

all = ["sovereign-claw[langgraph,dev]"]

[project.urls]
Repository = "https://github.com/BrewtaniusAI/sovereign-claw"
Issues = "https://github.com/BrewtaniusAI/sovereign-claw/issues"

[project.scripts]
sovereign = "sovereign_claw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereign_claw = ["distribution_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["sovereign_claw"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "python -m build"
dist_path = "dist/"
upload_to_vcs_release = true
commit_message = "chore(release): {version}"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "build", "ci", "docs", "test", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "build", "ci", "docs", "test", "chore"]
